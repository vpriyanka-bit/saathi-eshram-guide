const D={hi:{tag:"आपकी अपनी डिजिटल साथी",title:"आपका काम,<br><em>आपकी पहचान।</em>",intro:"ई-श्रम कार्ड के लिए खुद पंजीकरण करना सीखें। आसान भाषा में, एक कदम एक बार में।",note:"✳ यह मदद मुफ़्त है। ई-श्रम पंजीकरण भी मुफ़्त है।",float:"✓ आपका काम मायने रखता है",start:"यहाँ से शुरू करें",question:"आज आपको क्या करना है?",askLabel:"कुछ पूछना है? लिखें या बोलें",askBtn:"जवाब पाएँ",placeholder:"जैसे: आधार से जुड़ा मोबाइल नहीं है",back:"← पीछे",next:"अगला कदम →",again:"फिर से शुरू करें ↻",trust1:"घर से काम करने वाली महिलाओं के लिए भी",trust2:"आपकी निजी जानकारी हम नहीं लेते",trust3:"सरकारी मदद: 14434",help:"अटक गईं? कोई बात नहीं। सहायता नंबर पर पूछें।",phone:"e-श्रम सहायता: 14434 ↗",footer:"सखी — हर महिला के लिए, हर कदम पर।",source:"आधिकारिक जानकारी ↗",listen:"🔊 सुनें",steps:[{l:"पहले जानें",i:"◉",t:"क्या ई-श्रम आपके लिए है?",b:"अगर आप घर में सिलाई, खेत में मज़दूरी, सफ़ाई, घरेलू काम, छोटी दुकान, सामान बेचना या ऐसा कोई काम करती हैं, तो यह आपके काम आ सकता है। आपकी उम्र 16 से 59 साल होनी चाहिए और आप सरकारी नौकरी या EPFO/ESIC सदस्य नहीं होनी चाहिए।",tip:"संदेह है? 14434 पर पूछें। पंजीकरण से अपने-आप पैसे मिलने की गारंटी नहीं होती।"},{l:"सामान तैयार करें",i:"▤",t:"बस दो चीज़ें पास रखें",b:"अपना आधार कार्ड और वह मोबाइल फ़ोन तैयार रखें जिसका नंबर आधार से जुड़ा है। पंजीकरण के समय उस नंबर पर एक गुप्त कोड (OTP) आएगा।",tip:"आधार से जुड़ा मोबाइल नहीं है? नज़दीकी CSC या राज्य सेवा केंद्र पर उँगली के निशान से मुफ़्त पंजीकरण हो सकता है।"},{l:"अपना पंजीकरण करें",i:"↗",t:"अब सरकारी वेबसाइट खोलें",b:"नीचे दिए बटन से असली सरकारी e-Shram वेबसाइट खोलें। 'Register on eShram' चुनें। आधार नंबर सिर्फ़ उसी सरकारी वेबसाइट पर भरें। यहाँ, सखी पर, कभी अपना आधार या OTP न लिखें।",tip:"सखी सिर्फ़ समझाती है; आपका फ़ॉर्म या निजी जानकारी हमें नहीं दिखती."},{l:"अपना कार्ड पाएँ",i:"✓",t:"अपना कार्ड सँभालकर रखें",b:"काम पूरा होने पर अपना ई-श्रम कार्ड डाउनलोड करें या उसकी तस्वीर किसी भरोसेमंद जगह पर रखें। कार्ड में आपका 12 अंकों का UAN होता है।",tip:"रजिस्ट्रेशन मुफ़्त है। कोई पैसे माँगे तो न दें। 14434 पर रोज़ सुबह
